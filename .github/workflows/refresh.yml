name: Refresh Ramp

# GitHub cron runs in UTC and has no time zones, so each slot is listed for both winter (CET, UTC+1)
# and summer (CEST, UTC+2) and the "gate" step only lets the one that lands in the right local
# window through. Local targets: 06:15 Mon-Fri, 08:00 Sat-Sun (Europe/Berlin).
# Scheduled runs are often delayed 5-30 min; the gate accepts the whole local hour.
on:
  schedule:
    - cron: "15 4 * * 1-5"   # 06:15 CEST
    - cron: "15 5 * * 1-5"   # 06:15 CET
    - cron: "0 6 * * 6,0"    # 08:00 CEST
    - cron: "0 7 * * 6,0"    # 08:00 CET
    - cron: "5 9-20/3 * * *" # data only refresh every 3 h (keeps Past activities current, no new plan)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = sync + new plan, data = sync only"
        default: full
        type: choice
        options: [full, data]
      backfill_days:
        description: "How many days of sleep/HRV/resting HR to fetch if missing (first run: 30 is plenty)"
        default: "30"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write     # commit the encrypted history file
  pages: write
  id-token: write

concurrency:
  group: ramp
  cancel-in-progress: false

env:
  TZ_NAME: Europe/Berlin
  SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
  SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: gate
        run: |
          event="${{ github.event_name }}"
          dow=$(TZ=$TZ_NAME date +%u); hour=$(TZ=$TZ_NAME date +%H); hour=$((10#$hour))
          mode=full; run=true
          if [ "$event" = "schedule" ]; then
            cron="${{ github.event.schedule }}"
            if [ "$cron" = "5 9-20/3 * * *" ]; then
              mode=data
            else
              # morning slots: only the one that is actually 06:xx (weekday) / 08:xx (weekend) local
              if [ "$dow" -le 5 ] && [ "$hour" -ne 6 ]; then run=false; fi
              if [ "$dow" -ge 6 ] && [ "$hour" -ne 8 ]; then run=false; fi
            fi
          elif [ "$event" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
          else
            mode=data   # a code push rebuilds the site without spending an API call
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "event=$event local_dow=$dow local_hour=$hour mode=$mode run=$run"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requirements.txt }
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: "22" }

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Restore history (encrypted)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p build
          if [ -f state/state.enc ]; then node scripts/crypt.mjs decrypt state/state.enc build/state.json; fi

      - name: Sync from Garmin
        if: steps.gate.outputs.run == 'true'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python scripts/sync_garmin.py

      - name: Generate today's plan
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'full'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/plan.py

      - name: Assemble and encrypt
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/assemble.py
          rm -rf dist && mkdir dist && cp -r site/* dist/
          node scripts/crypt.mjs encrypt build/data.json dist/data.enc
          node scripts/crypt.mjs encrypt build/state.json state/state.enc

      - name: Save history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "ramp-bot"; git config user.email "ramp-bot@users.noreply.github.com"
          git add state/state.enc config/salt.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update history $(date -u '+%F %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "::warning::Could not push history; the next run will rebuild missing days"
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with: { path: dist }

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
