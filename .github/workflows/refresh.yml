name: Refresh Ramp

run-name: Ramp ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name }}

# Modes
#   data           sync Garmin and redeploy (free: no Claude call). Scheduled + on code pushes.
#   plan           sync, then Claude plans the requested dates (max 7 days). Started from the app.
#   refresh_today  sync, then Claude re-balances only today's session. Started from the app.
#
# plan / refresh_today need an encrypted `payload` made by the app with your site key (dates, constraints,
# note). Workflow inputs are public on a public repo, so they only ever carry ciphertext.
#
# GitHub cron is UTC with no time zones, so each slot is listed for winter (CET) and summer (CEST) and
# the gate step lets through only the one that lands in the right Berlin hour:
# 06:15 Mon-Fri and 08:00 Sat-Sun, data only. Scheduled runs are often delayed by 5-30 minutes.
on:
  schedule:
    - cron: "15 4 * * 1-5"   # 06:15 CEST
    - cron: "15 5 * * 1-5"   # 06:15 CET
    - cron: "0 6 * * 6,0"    # 08:00 CEST
    - cron: "0 7 * * 6,0"    # 08:00 CET
    - cron: "5 9-20/3 * * *" # data refresh every 3 h during the day
  workflow_dispatch:
    inputs:
      mode:
        description: "data = sync only, plan / refresh_today = started from the app"
        default: data
        type: choice
        options: [data, plan, refresh_today]
      payload:
        description: "Encrypted request from the app (leave empty for data)"
        default: ""
        type: string
      backfill_days:
        description: "How many days of sleep/HRV/resting HR to fetch if missing"
        default: "30"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write     # commit the encrypted history file
  pages: write
  id-token: write

concurrency:
  group: ramp
  cancel-in-progress: false

env:
  TZ_NAME: Europe/Berlin
  SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
  SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          dow=$(TZ=$TZ_NAME date +%u); hour=$(TZ=$TZ_NAME date +%H); hour=$((10#$hour))
          mode=data; run=true
          if [ "$EVENT" = "schedule" ] && [ "$CRON" != "5 9-20/3 * * *" ]; then
            # morning slots: only the one that is actually 06:xx (weekday) / 08:xx (weekend) in Berlin
            if [ "$dow" -le 5 ] && [ "$hour" -ne 6 ]; then run=false; fi
            if [ "$dow" -ge 6 ] && [ "$hour" -ne 8 ]; then run=false; fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            mode="${INPUT_MODE:-data}"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT local_dow=$dow local_hour=$hour mode=$mode run=$run"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requirements.txt }
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: "22" }

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Read the app's request
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode != 'data'
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          mkdir -p build
          if [ -z "$PAYLOAD" ]; then
            echo "::error::No request payload. Plans are started from the app (Plan tab), which encrypts the request."; exit 1
          fi
          printf '%s' "$PAYLOAD" > build/request.enc
          if ! node scripts/crypt.mjs decrypt build/request.enc build/request.json; then
            echo "::error::Could not decrypt the request. Sign out and in again in the app (the site password may have changed)."; exit 1
          fi
          echo "request decrypted ($(wc -c < build/request.json) bytes)"

      - name: Restore history (encrypted)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p build
          if [ -f state/state.enc ]; then node scripts/crypt.mjs decrypt state/state.enc build/state.json; fi

      - name: Sync from Garmin
        if: steps.gate.outputs.run == 'true'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python scripts/sync_garmin.py

      - name: Claude plan
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode != 'data'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PLAN_MODE: ${{ steps.gate.outputs.mode }}
        run: python scripts/plan.py

      - name: Assemble and encrypt
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/assemble.py
          rm -rf dist && mkdir dist && cp -r site/* dist/
          node scripts/crypt.mjs encrypt build/data.json dist/data.enc
          node scripts/crypt.mjs encrypt build/state.json state/state.enc

      - name: Save history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "ramp-bot"; git config user.email "ramp-bot@users.noreply.github.com"
          git add state/state.enc config/salt.txt config/athlete.json
          if ! git diff --cached --quiet; then
            git commit -m "Update history $(date -u '+%F %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "::warning::Could not push history; the next run will rebuild missing days"
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with: { path: dist }

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
